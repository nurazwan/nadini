# Renders Nadini in several configurations and runs each generated
# project's lint + tests, plus the committed example.
name: template-ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch breaking changes in the latest SDK releases

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { framework: langgraph, checkpointer: memory,   langfuse: true,  devui: true,  auth: false, host: 127.0.0.1, ci: test,      builder: runner }
          - { framework: langchain, checkpointer: memory,   langfuse: false, devui: true,  auth: true,  host: 0.0.0.0,   ci: dockerhub, builder: runner }
          - { framework: langgraph, checkpointer: postgres, langfuse: true,  devui: false, auth: false, host: 127.0.0.1, ci: dockerhub, builder: cloud }
          - { framework: langchain, checkpointer: postgres, langfuse: false, devui: false, auth: true,  host: 0.0.0.0,   ci: none,      builder: runner }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Render
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          uvx copier copy --trust --defaults --vcs-ref HEAD . /tmp/agent \
            -d project_name="CI Agent" \
            -d framework=${{ matrix.framework }} \
            -d checkpointer=${{ matrix.checkpointer }} \
            -d enable_langfuse=${{ matrix.langfuse }} \
            -d enable_devui=${{ matrix.devui }} \
            -d enable_auth=${{ matrix.auth }} \
            -d bind_host=${{ matrix.host }} \
            -d ci=${{ matrix.ci }} \
            -d dockerhub_image=ci/agent \
            -d docker_builder=${{ matrix.builder }} \
            -d build_cloud_builder=ci/builder
      - name: Lint generated workflow + compose
        if: matrix.ci != 'none'
        working-directory: /tmp/agent
        run: |
          uvx --from actionlint-py actionlint .github/workflows/ci.yml
          cp .env.example .env && docker compose config -q
      - name: Lint + test
        working-directory: /tmp/agent
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
      - name: Docker build
        working-directory: /tmp/agent
        run: docker build -t ci-agent .

  defaults:
    # Render with only the branch-selecting answers, so every other question
    # falls back to its default. Copier validates defaults too, so a default
    # that fails its own validator breaks the interactive prompt.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ci: none,      builder: runner }
          - { ci: test,      builder: runner }
          - { ci: dockerhub, builder: runner }
          - { ci: dockerhub, builder: cloud }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: |
          git config --global user.email ci@example.com && git config --global user.name ci
          uvx copier copy --trust --defaults --vcs-ref HEAD . /tmp/agent \
            -d ci=${{ matrix.ci }} -d docker_builder=${{ matrix.builder }} -d install_deps=false

  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - working-directory: examples/research-assistant
        run: |
          uv sync --locked
          uv run ruff check .
          uv run pytest -q
